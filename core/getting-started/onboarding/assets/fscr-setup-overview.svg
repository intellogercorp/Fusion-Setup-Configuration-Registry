<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">FSCR Setup — End to End</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#6b7280">One-time setup (1–3), first-use login (4), then everyday work (5)</text>

  <!-- Lane labels -->

  <!-- Step 1 -->
  <rect x="30" y="120" width="195" height="250" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="127" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">1. Prerequisites</text>
  <text x="127" y="166" text-anchor="middle" font-size="11" fill="#6366f1">Your machine + Fusion</text>
  <g font-size="12" fill="#1f2937">
    <text x="45" y="196">• Fusion 26D (06 Nov 2026</text>
    <text x="55" y="212">maintenance pack) or later</text>
    <text x="45" y="236">• Python 3.11+</text>
    <text x="45" y="260">• Clone FSCR repo and</text>
    <text x="55" y="276">open it in AI assistant</text>
    <text x="45" y="300">• A Fusion user with the</text>
    <text x="55" y="316">roles/data access needed</text>
    <text x="45" y="340">• An OCI IAM Identity</text>
    <text x="55" y="356">Domain administrator</text>
  </g>

  <!-- Step 2 -->
  <rect x="245" y="120" width="245" height="250" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="367" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">2. Create OAuth client</text>
  <text x="367" y="166" text-anchor="middle" font-size="11" fill="#0891b2">OCI IAM console (Identity Domain)</text>
  <g font-size="12" fill="#1f2937">
    <text x="260" y="196">• Integrated apps → Add →</text>
    <text x="270" y="212"><tspan font-weight="700">Mobile Application</tspan> (public)</text>
    <text x="260" y="236">• Grant: Authorization code</text>
    <text x="260" y="260">• Callback (allow non-HTTPS):</text>
    <text x="270" y="276" font-family="Consolas, monospace" font-size="10.5">127.0.0.1:8765/oauth/callback</text>
    <text x="260" y="300">• Add 4 mandatory scopes:</text>
    <text x="270" y="316" font-size="11">Fusion, Fusion AI, BOSS,</text>
    <text x="270" y="331" font-size="11">spectra-fusion-common</text>
    <text x="260" y="355">• Activate → copy <tspan font-weight="700">Client ID</tspan></text>
  </g>

  <!-- Step 3 -->
  <rect x="510" y="120" width="245" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="632" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">3. Configure FSCR</text>
  <text x="632" y="166" text-anchor="middle" font-size="11" fill="#16a34a">core/auth/fusionEnv.properties</text>
  <g font-size="11.5" fill="#1f2937" font-family="Consolas, monospace">
    <text x="525" y="196">environment=MY_ENV</text>
    <text x="525" y="214">restBaseUrl=https://…</text>
    <text x="525" y="232">clientId=&lt;Client ID&gt;</text>
    <text x="525" y="250">redirectUrl=http://127…</text>
    <text x="525" y="268">scope= / ai_scope=</text>
    <text x="525" y="286">boss_scope=</text>
    <text x="525" y="304">fusion_common_scope=</text>
  </g>
  <g font-size="11.5" fill="#1f2937">
    <text x="525" y="330">Optional: km, rmc, cpq, Field</text>
    <text x="525" y="346">Service, CX Unity scopes/URLs</text>
    <text x="525" y="362" fill="#b91c1c">No secrets or tokens here</text>
  </g>

  <!-- Step 4 -->
  <rect x="775" y="120" width="295" height="250" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="922" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">4. Enroll + log in (first use)</text>
  <text x="922" y="166" text-anchor="middle" font-size="11" fill="#ea580c">Automatic, or test with "fusion login"</text>
  <g font-size="12" fill="#1f2937">
    <text x="790" y="196">• Enrollment: give Fusion URL,</text>
    <text x="800" y="212">environment name, Client ID</text>
    <text x="790" y="232">  → trust file</text>
    <text x="800" y="248" font-family="Consolas, monospace" font-size="10.5">~/.fusionaim/oauth-trust.json</text>
    <text x="790" y="274">• Browser sign-in (SSO/MFA) via</text>
    <text x="800" y="290">PKCE — no client secret</text>
    <text x="790" y="316">• Access token cached privately in</text>
    <text x="800" y="332" font-family="Consolas, monospace" font-size="10.5">~/.fusionaim/…_token.json</text>
    <text x="790" y="356">  (outside the repo; re-login on expiry)</text>
  </g>

  <!-- arrows between steps -->
  <line x1="225" y1="245" x2="243" y2="245" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="245" x2="508" y2="245" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="755" y1="245" x2="773" y2="245" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- arrow down to step 5 -->
  <path d="M922,370 L922,410 L550,410 L550,428" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="150" y="430" width="800" height="105" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="550" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">5. Start working: "Start an implementation for …"</text>
  <g font-size="12.5" fill="#1f2937" text-anchor="middle">
    <text x="550" y="484">Implementation router → creates project workspace project/draft_impl_project_&lt;date&gt; (state, artifacts, exports)</text>
    <text x="550" y="506">→ routes to shared / pillar skills → Fusion REST calls reuse the cached token</text>
    <text x="550" y="526" fill="#6b21a8">Any change to Fusion is shown first and needs your explicit approval</text>
  </g>
</svg>
